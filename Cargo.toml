[package]
name = "mdviewer"
version = "0.1.0"
edition = "2024"
description = "A small, viewer-first Markdown reader for Windows"

[[bin]]
name = "MDViewer"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
http = "1.3"
mime_guess = "2.0.5"
open = "5.3"
percent-encoding = "2.3.2"
pulldown-cmark = "0.13.4"
tao = "0.35.3"
url = "2.5"
wry = "0.55.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[build-dependencies]
winres = "0.1.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
